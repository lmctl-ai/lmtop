name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     name: linux-x86_64,   file_pat: 'x86-64|x86_64' }
          - { runner: ubuntu-24.04-arm, name: linux-arm64,    file_pat: 'aarch64|arm64' }
          - { runner: macos-15-intel,   name: macos-x86_64,   file_pat: 'x86-64|x86_64' }
          - { runner: macos-15,         name: macos-arm64,    file_pat: 'aarch64|arm64' }
          - { runner: windows-2025,     name: windows-x86_64, pe_machine: '0x8664', ext: .exe }
          - { runner: windows-11-arm,   name: windows-arm64,  pe_machine: '0xAA64', ext: .exe, cmake_args: '-A ARM64' }
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Probe PDH via Get-Counter
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Get-Counter '\Processor(_Total)\% User Time' -MaxSamples 2 | Out-Null
            Write-Host "PDH PROBE: OK"
          } catch {
            Write-Host "PDH PROBE: FAILED - $_"
          }

      - name: Repair performance counters
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          lodctr /R
          Set-Location C:\Windows\SysWOW64
          lodctr /R

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Verify PE machine type
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter lmtop.exe build | Select-Object -First 1
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $peOff = $br.ReadUInt32()
          $fs.Seek($peOff + 4, 'Begin') | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          $expected = [Convert]::ToInt64('${{ matrix.pe_machine }}', 16)
          if ($machine -ne $expected) { throw "lmtop.exe machine=0x$($machine.ToString('X4')), expected ${{ matrix.pe_machine }}" }
          Write-Host "PE machine: 0x$($machine.ToString('X4')) (expected ${{ matrix.pe_machine }})"

      - name: Verify executable architecture
        if: runner.os != 'Windows'
        run: |
          binary=$(find build -type f -name lmtop ! -path '*CMakeFiles*' | head -n1)
          file "$binary"
          file "$binary" | grep -E '${{ matrix.file_pat }}'

      - name: Integration test
        run: python3 tests/integration.py build

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: lmtop-${{ matrix.name }}
          path: |
            build/**/lmtop
            build/**/lmtop.exe
          if-no-files-found: error
