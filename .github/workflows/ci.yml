name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Probe PDH via Get-Counter
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Get-Counter '\Processor(_Total)\% User Time' -MaxSamples 2 | Out-Null
            Write-Host "PDH PROBE: OK"
          } catch {
            Write-Host "PDH PROBE: FAILED - $_"
          }

      - name: Repair performance counters
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          lodctr /R
          Set-Location C:\Windows\SysWOW64
          lodctr /R

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Verify x86_64 binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter lmtop.exe build | Select-Object -First 1
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $peOff = $br.ReadUInt32()
          $fs.Seek($peOff + 4, 'Begin') | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($machine -ne 0x8664) { throw "lmtop.exe is not x64 (machine=0x$($machine.ToString('X4')))" }
          Write-Host "PE machine: 0x$($machine.ToString('X4')) (x64)"

      - name: Integration test
        run: python3 tests/integration.py build

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: lmtop-${{ matrix.os }}
          path: |
            build/**/lmtop
            build/**/lmtop.exe
          if-no-files-found: error
