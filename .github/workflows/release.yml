name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lmtop-linux-x86_64
          - os: windows-2025
            asset: lmtop-windows-x86_64.exe
          - os: macos-latest
            asset: lmtop-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Probe PDH via Get-Counter
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Get-Counter '\Processor(_Total)\% User Time' -MaxSamples 2 | Out-Null
            Write-Host "PDH PROBE: OK"
          } catch {
            Write-Host "PDH PROBE: FAILED - $_"
          }

      - name: Repair performance counters
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          lodctr /R
          Set-Location C:\Windows\SysWOW64
          lodctr /R

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_GENERATOR_PLATFORM=x64

      - name: Build
        run: cmake --build build --config Release -j

      - name: Verify x86_64 binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter lmtop.exe build | Select-Object -First 1
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $peOff = $br.ReadUInt32()
          $fs.Seek($peOff + 4, 'Begin') | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($machine -ne 0x8664) { throw "lmtop.exe is not x64 (machine=0x$($machine.ToString('X4')))" }
          Write-Host "PE machine: 0x$($machine.ToString('X4')) (x64)"

      - name: Integration test
        run: python3 tests/integration.py build

      - name: Stage asset
        shell: bash
        run: |
          binary=$(python3 -c "
          import glob
          c = [p for pat in ('lmtop', 'lmtop.exe') for p in glob.glob('build/**/' + pat, recursive=True)]
          c = [p for p in c if 'CMakeFiles' not in p]
          print(sorted(c, key=len)[0])")
          cp "$binary" "${{ matrix.asset }}"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" --generate-notes
